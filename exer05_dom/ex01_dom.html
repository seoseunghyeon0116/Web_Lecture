
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>DOM 선택 실습</title>
    <script>
        window.onload = function() {
            // TODO 1. ID로 제목 선택 및 색상 변경
            let tt = document.getElementById('title');
            tt.style.color='blue';

            // TODO 2. h2 선택 및 텍스트 변경
            let a = document.querySelector('h2');
            a.innerHTML = 'JavaScript로 변경한 제목';


            // TODO 3. class로 여러 요소 선택 및 색상 변경
            let it = document.getElementsByClassName('item');
            for(let i = 0; i<it.length;i++){
                let it2 = it[i];

                it2.style.color = 'red';
            }
            // TODO 4. name으로 여러 요소 선택 및 배경색 변경
            let mes = document.getElementsByName('message');
            for(let i = 0; i<mes.length;i++){
                let mes2 = mes[i];

                mes2.style.backgroundColor = 'yellow';
            }
            // TODO 5. 모든 p 요소 선택 및 글자 굵게 변경
            let pp = document.querySelectorAll('p');
            for(let i = 0; i<pp.length;i++){
                let pp2 = pp[i];

                pp2.style.fontWeight = 'bold'; 
            }
        };
    </script>
</head>
<body>
    <h1 id="title">DOM 선택 실습</h1>
    <h2>기존 제목</h2>

    <p class="item">첫 번째 항목</p>
    <p class="item">두 번째 항목</p>
    <p class="item">세 번째 항목</p>

    <p name="message">안녕하세요!</p>
    <p name="message">JavaScript 실습입니다.</p>
</body>
</html>
